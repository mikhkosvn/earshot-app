services:
  postgres:
    image: postgres:17-alpine
    container_name: earshot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: earshot
      POSTGRES_PASSWORD: earshot
      POSTGRES_DB: earshot
    ports:
      - '5432:5432'
    volumes:
      - earshot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U earshot -d earshot']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: earshot-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  code-runner:
    image: python:3.12-alpine
    container_name: earshot-code-runner
    restart: unless-stopped
    command: ['python', '-I', '/app/runner.py']
    environment:
      CODE_RUNNER_PORT: '8000'
    ports:
      - '8765:8000'
    volumes:
      - ./docker/code-runner:/app:ro
    read_only: true
    tmpfs:
      - /tmp
    user: '65534:65534'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 64

volumes:
  earshot-postgres-data:
